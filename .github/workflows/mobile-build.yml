# 모바일 앱(스토어용) 자동 빌드 — 코드를 올리면 안드로이드 설치 파일(APK)과 아이폰 빌드 확인까지 자동으로 합니다.
# · 안드로이드: 시험 설치용 APK(debug)는 항상 만들어 Actions › 이 실행 › Artifacts 에서 내려받기
#   출시용 AAB(플레이스토어 업로드)는 저장소 Secrets 에 서명 키를 넣으면 함께 만듦
#   ANDROID_KEYSTORE_BASE64(키 파일을 base64로), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# · 아이폰: 서명 없이 시뮬레이터용으로 빌드해 오류가 없는지 확인 (앱스토어 업로드는 애플 개발자 계정 등록 후 추가)
name: Mobile app build
on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS }}
  VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: 시험 설치용 APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: 출시용 서명 키 준비
        id: key
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"; fi
      - name: 출시용 AAB (플레이스토어 업로드)
        if: steps.key.outputs.file != ''
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon
      - run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/midaegallae-$(node -p "require('./package.json').version")-test.apk"
          if ls android/app/build/outputs/bundle/release/*.aab >/dev/null 2>&1; then cp android/app/build/outputs/bundle/release/*.aab "out/midaegallae-$(node -p "require('./package.json').version")-release.aab"; fi
      - uses: actions/upload-artifact@v4
        with: { name: android-app, path: out/, retention-days: 30 }
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: 아이폰 빌드 확인 (서명 없음, 시뮬레이터)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -30
