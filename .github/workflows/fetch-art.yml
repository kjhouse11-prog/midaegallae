# 공공 저작물(퍼블릭 도메인) 명화를 위키미디어에서 받아 저장소 art-src/ 에 저장합니다. 필요할 때 수동 실행.
# 검색어마다 위키미디어 공용 파일 검색 상위 2개를 받아 후보로 저장 (art-src/candidates/), 파일 제목은 art-src/candidates/list.txt
name: Fetch public-domain art
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p art-src/candidates
          UA="midaegallae-build/0.9 (https://github.com/kjhouse11-prog/midaegallae)"
          API="https://commons.wikimedia.org/w/api.php"
          pick() {
            slug="$1"; q="$2"
            curl -fsSL -A "$UA" -G "$API" --data-urlencode "action=query" --data-urlencode "format=json" --data-urlencode "generator=search" \
              --data-urlencode "gsrnamespace=6" --data-urlencode "gsrlimit=2" --data-urlencode "gsrsearch=$q" \
              --data-urlencode "prop=imageinfo" --data-urlencode "iiprop=url|size|extmetadata" --data-urlencode "iiurlwidth=2400" -o /tmp/r.json || return 0
            jq -r '.query.pages // {} | to_entries | sort_by(.value.index) | .[] | [.value.title, (.value.imageinfo[0].thumburl // .value.imageinfo[0].url), (.value.imageinfo[0].extmetadata.LicenseShortName.value // "")] | @tsv' /tmp/r.json > /tmp/r.tsv
            n=0
            while IFS=$'\t' read -r title url lic; do
              n=$((n+1)); f="art-src/candidates/${slug}-${n}.jpg"
              curl -fsSL -A "$UA" "$url" -o "$f" && echo -e "${slug}-${n}.jpg\t${title}\t${lic}\t${url}" >> art-src/candidates/list.txt
              sleep 1
            done < /tmp/r.tsv
          }
          pick monalisa "Mona Lisa by Leonardo da Vinci from C2RMF retouched"
          pick vitruvian "Da Vinci Vitruve Luc Viatour"
          cat art-src/candidates/list.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add art-src && git commit -m "명화 후보 받기 (퍼블릭 도메인, 위키미디어 공용)" && git push
